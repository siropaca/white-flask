openapi: 3.0.3
info:
  title: White Flask Backend API
  description: Backend API for White Flask blog system
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /hello:
    get:
      operationId: getHello
      summary: Hello endpoint
      description: Returns a simple hello message
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelloResponse'
components:
  schemas:
    HelloResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Hello, World!
